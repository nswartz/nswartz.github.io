<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
      {% include header.html %}
      <section id="about">
        {% include about.html %}
      </section>
      <section id="interests">
        {% include interests.html %}
      </section>
      <!-- <section id="projects">
        {% include projects.html %}
      </section> -->
        {{ content }}
      {% include footer.html %}

      <!-- Resume Modal -->
      <div id="resume-modal" class="resume-modal" hidden>
        <div class="resume-modal-backdrop"></div>
        <div class="resume-modal-container">
          <div class="resume-modal-header">
            <span>Resume</span>
            <div class="resume-modal-actions">
              <a href="{{ "/assets/Noah_Swartz_Resume.pdf" | prepend: site.baseurl }}" download aria-label="Download Resume">
                <i class="fa-solid fa-download"></i>
              </a>
              <button class="resume-close-btn" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="resume-modal-body">
            <iframe src="{{ "/assets/Noah_Swartz_Resume.pdf" | prepend: site.baseurl }}" title="Resume"></iframe>
          </div>
        </div>
      </div>
  </body>
